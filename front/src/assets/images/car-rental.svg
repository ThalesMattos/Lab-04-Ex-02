<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2f1"/>
      <stop offset="100%" stop-color="#b2dfdb"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#546e7a"/>
      <stop offset="100%" stop-color="#37474f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#sky)"/>

  <!-- Buildings -->
  <rect x="20" y="100" width="50" height="130" rx="2" fill="#90a4ae"/>
  <rect x="30" y="110" width="10" height="12" rx="1" fill="#e0f2f1"/>
  <rect x="50" y="110" width="10" height="12" rx="1" fill="#e0f2f1"/>
  <rect x="30" y="130" width="10" height="12" rx="1" fill="#e0f2f1"/>
  <rect x="50" y="130" width="10" height="12" rx="1" fill="#e0f2f1"/>
  <rect x="30" y="150" width="10" height="12" rx="1" fill="#e0f2f1"/>
  <rect x="50" y="150" width="10" height="12" rx="1" fill="#e0f2f1"/>

  <rect x="80" y="130" width="40" height="100" rx="2" fill="#78909c"/>
  <rect x="88" y="140" width="8" height="10" rx="1" fill="#e0f2f1"/>
  <rect x="104" y="140" width="8" height="10" rx="1" fill="#e0f2f1"/>
  <rect x="88" y="158" width="8" height="10" rx="1" fill="#e0f2f1"/>
  <rect x="104" y="158" width="8" height="10" rx="1" fill="#e0f2f1"/>

  <rect x="300" y="110" width="60" height="120" rx="2" fill="#90a4ae"/>
  <rect x="310" y="120" width="10" height="12" rx="1" fill="#e0f2f1"/>
  <rect x="340" y="120" width="10" height="12" rx="1" fill="#e0f2f1"/>
  <rect x="310" y="140" width="10" height="12" rx="1" fill="#e0f2f1"/>
  <rect x="340" y="140" width="10" height="12" rx="1" fill="#e0f2f1"/>
  <rect x="310" y="160" width="10" height="12" rx="1" fill="#e0f2f1"/>
  <rect x="340" y="160" width="10" height="12" rx="1" fill="#e0f2f1"/>

  <!-- Road -->
  <rect x="0" y="230" width="400" height="70" fill="url(#road)"/>
  <rect x="40" y="262" width="30" height="4" rx="2" fill="#ffeb3b" opacity="0.7"/>
  <rect x="110" y="262" width="30" height="4" rx="2" fill="#ffeb3b" opacity="0.7"/>
  <rect x="180" y="262" width="30" height="4" rx="2" fill="#ffeb3b" opacity="0.7"/>
  <rect x="250" y="262" width="30" height="4" rx="2" fill="#ffeb3b" opacity="0.7"/>
  <rect x="320" y="262" width="30" height="4" rx="2" fill="#ffeb3b" opacity="0.7"/>

  <!-- Car body -->
  <g transform="translate(120, 200)">
    <!-- Shadow -->
    <ellipse cx="80" cy="55" rx="75" ry="8" fill="#263238" opacity="0.2"/>
    <!-- Body lower -->
    <rect x="10" y="20" width="140" height="30" rx="8" fill="#00796b"/>
    <!-- Body upper (cabin) -->
    <path d="M45 20 L60 0 L110 0 L130 20 Z" fill="#00897b"/>
    <!-- Windows -->
    <path d="M50 18 L62 3 L85 3 L85 18 Z" fill="#e0f2f1" opacity="0.85"/>
    <path d="M90 18 L90 3 L108 3 L125 18 Z" fill="#e0f2f1" opacity="0.85"/>
    <!-- Headlights -->
    <rect x="145" y="26" width="8" height="8" rx="2" fill="#fff9c4"/>
    <rect x="7" y="26" width="8" height="8" rx="2" fill="#ef5350"/>
    <!-- Wheels -->
    <circle cx="45" cy="50" r="14" fill="#37474f"/>
    <circle cx="45" cy="50" r="8" fill="#78909c"/>
    <circle cx="45" cy="50" r="3" fill="#37474f"/>
    <circle cx="115" cy="50" r="14" fill="#37474f"/>
    <circle cx="115" cy="50" r="8" fill="#78909c"/>
    <circle cx="115" cy="50" r="3" fill="#37474f"/>
    <!-- Door handle -->
    <rect x="78" y="28" width="12" height="3" rx="1.5" fill="#004d40"/>
  </g>

  <!-- Key icon floating -->
  <g transform="translate(290, 65)" opacity="0.6">
    <circle cx="12" cy="12" r="10" fill="none" stroke="#00796b" stroke-width="2.5"/>
    <circle cx="12" cy="12" r="4" fill="none" stroke="#00796b" stroke-width="2"/>
    <line x1="22" y1="12" x2="38" y2="12" stroke="#00796b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="12" x2="32" y2="18" stroke="#00796b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="36" y1="12" x2="36" y2="16" stroke="#00796b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Cloud -->
  <g transform="translate(140, 30)" opacity="0.5">
    <ellipse cx="30" cy="20" rx="30" ry="15" fill="white"/>
    <ellipse cx="55" cy="22" rx="22" ry="12" fill="white"/>
    <ellipse cx="10" cy="22" rx="18" ry="10" fill="white"/>
  </g>
</svg>
