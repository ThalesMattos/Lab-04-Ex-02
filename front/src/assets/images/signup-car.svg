<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- Clipboard / Document -->
  <g transform="translate(100, 30)">
    <!-- Board -->
    <rect x="30" y="20" width="140" height="190" rx="8" fill="#fff" stroke="#a5d6a7" stroke-width="2"/>
    <!-- Clip -->
    <rect x="75" y="12" width="50" height="20" rx="5" fill="#66bb6a"/>
    <circle cx="100" cy="16" r="4" fill="#fff"/>
    <!-- Lines -->
    <rect x="50" y="50" width="100" height="6" rx="3" fill="#c8e6c9"/>
    <rect x="50" y="68" width="80" height="6" rx="3" fill="#c8e6c9"/>
    <rect x="50" y="86" width="90" height="6" rx="3" fill="#c8e6c9"/>
    <rect x="50" y="104" width="70" height="6" rx="3" fill="#c8e6c9"/>
    <!-- Separator -->
    <line x1="50" y1="125" x2="150" y2="125" stroke="#a5d6a7" stroke-width="1"/>
    <!-- Checkboxes -->
    <rect x="50" y="138" width="12" height="12" rx="2" fill="none" stroke="#66bb6a" stroke-width="2"/>
    <polyline points="52,145 56,149 60,141" fill="none" stroke="#66bb6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="70" y="140" width="60" height="6" rx="3" fill="#e8f5e9"/>

    <rect x="50" y="158" width="12" height="12" rx="2" fill="none" stroke="#66bb6a" stroke-width="2"/>
    <polyline points="52,165 56,169 60,161" fill="none" stroke="#66bb6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="70" y="160" width="50" height="6" rx="3" fill="#e8f5e9"/>

    <rect x="50" y="178" width="12" height="12" rx="2" fill="none" stroke="#a5d6a7" stroke-width="2"/>
    <rect x="70" y="180" width="70" height="6" rx="3" fill="#e8f5e9"/>
  </g>

  <!-- Car silhouette -->
  <g transform="translate(60, 220)" opacity="0.35">
    <path d="M20 20 L35 0 L80 0 L95 20 Z" fill="#388e3c"/>
    <rect x="5" y="20" width="105" height="20" rx="6" fill="#388e3c"/>
    <circle cx="30" cy="40" r="10" fill="#2e7d32"/>
    <circle cx="85" cy="40" r="10" fill="#2e7d32"/>
  </g>

  <!-- Person silhouette -->
  <g transform="translate(280, 80)" opacity="0.3">
    <circle cx="25" cy="20" r="16" fill="#388e3c"/>
    <path d="M5 75 Q5 45 25 40 Q45 45 45 75 Z" fill="#388e3c"/>
  </g>

  <!-- Key -->
  <g transform="translate(270, 180)" opacity="0.4">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#388e3c" stroke-width="3"/>
    <circle cx="20" cy="20" r="7" fill="none" stroke="#388e3c" stroke-width="2.5"/>
    <line x1="36" y1="20" x2="60" y2="20" stroke="#388e3c" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="20" x2="50" y2="30" stroke="#388e3c" stroke-width="3" stroke-linecap="round"/>
    <line x1="56" y1="20" x2="56" y2="28" stroke="#388e3c" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="30" cy="30" r="4" fill="#a5d6a7" opacity="0.5"/>
  <circle cx="370" cy="50" r="6" fill="#a5d6a7" opacity="0.4"/>
  <circle cx="350" cy="270" r="5" fill="#a5d6a7" opacity="0.3"/>
  <circle cx="50" cy="270" r="3" fill="#a5d6a7" opacity="0.4"/>
</svg>
