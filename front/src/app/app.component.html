<mat-toolbar color="primary" class="app-toolbar">
  <span class="app-title">🚗 Sistema de Aluguel de Carros</span>
  <span class="spacer"></span>
  @if (auth.estaLogado()) {
    <a mat-button routerLink="/pedidos" class="nav-link">Pedidos</a>
    <a mat-button routerLink="/automoveis" class="nav-link">Automóveis</a>
    @if (auth.ehAgente()) {
      <a mat-button routerLink="/clientes" class="nav-link">Clientes</a>
    }
    @if (auth.ehCliente()) {
      <a mat-button routerLink="/meu-cadastro" class="nav-link">Meu Cadastro</a>
    }
    <mat-chip
      [color]="auth.ehAgente() ? 'accent' : 'primary'"
      selected
      class="tipo-chip"
    >
      {{ auth.usuarioLogado()?.tipo }}
    </mat-chip>
    <span class="usuario-nome">{{ auth.usuarioLogado()?.nome }}</span>
    <button mat-button class="nav-link" (click)="logout()">Sair</button>
  } @else {
    <a mat-button routerLink="/login" class="nav-link">Login</a>
    <a mat-button routerLink="/cadastro" class="nav-link">Cadastro</a>
  }
</mat-toolbar>

<router-outlet></router-outlet>
