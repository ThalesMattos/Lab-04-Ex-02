#Sat Mar 28 00:45:01 UTC 2026
micronaut.application.name=sistema-de-carros

# Swagger UI static resources
micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger-ui.paths=classpath:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**

# H2 Datasource (banco em memoria)
datasource.default.url=jdbc:h2:mem:sistemaCarros;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
datasource.default.username=sa
datasource.default.password=
datasource.default.driver-class-name=org.h2.Driver

# JPA / Hibernate
jpa.default.entity-scan.packages=com.example.model
jpa.default.properties.hibernate.hbm2ddl.auto=create-drop
jpa.default.properties.hibernate.show_sql=true

